<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable File Transfer</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">📁 Portable File Transfer</h1>
            </div>
            <div class="header-right">
                <div class="view-toggle">
                    <button id="gridViewBtn" class="view-btn active" title="Grid view">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <rect x="1" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="12" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="1" y="12" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="12" y="12" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                    <button id="listViewBtn" class="view-btn" title="List view">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <line x1="2" y1="4" x2="18" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="2" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="2" y1="16" x2="18" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <button id="themeToggle" class="icon-btn" title="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <main class="main">
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb">
                    <button class="breadcrumb-item" data-path="">🏠 Home</button>
                </div>
                <div class="toolbar-actions">
                    <button id="newFolderBtn" class="btn btn-secondary" title="New folder">
                        <span>+</span> New Folder
                    </button>
                    <label class="btn btn-primary upload-btn">
                        <span>⬆</span> Upload
                        <input type="file" id="fileInput" multiple hidden>
                    </label>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search files and folders..." autocomplete="off">
            </div>

            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">📤</div>
                    <p>Drag and drop files here to upload</p>
                </div>
            </div>

            <div id="fileContainer" class="file-container grid-view">
                <div id="fileList" class="file-list"></div>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>This folder is empty</p>
            </div>
        </main>

        <footer class="footer">
            <div class="connection-info" id="connectionInfo">
                <span class="connection-url">Loading...</span>
            </div>
        </footer>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="shareModal" class="modal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Share File</h2>
                <button class="modal-close" data-close="shareModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="shareForm">
                    <input type="hidden" id="sharePath">
                    <div class="form-group">
                        <label for="shareExpiry">Expires in (hours)</label>
                        <input type="number" id="shareExpiry" value="24" min="1" max="720">
                    </div>
                    <div class="form-group">
                        <label for="sharePassword">Password (optional)</label>
                        <input type="password" id="sharePassword" placeholder="Leave empty for no password">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" data-close="shareModal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Share</button>
                    </div>
                </form>
                <div id="shareResult" class="share-result" style="display: none;">
                    <div class="form-group">
                        <label>Share Link</label>
                        <div class="share-link-container">
                            <input type="text" id="shareLink" readonly>
                            <button id="copyShareLink" class="btn btn-secondary">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="previewModal" class="modal" style="display: none;">
        <div class="modal-backdrop" data-close="previewModal"></div>
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="previewTitle">File Preview</h2>
                <button class="modal-close" data-close="previewModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="previewContent"></div>
            </div>
        </div>
    </div>

    <div id="contextMenu" class="context-menu" style="display: none;"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
