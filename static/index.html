<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftShare</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="min-h-screen">
    <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-4 py-5 sm:px-6">
        <!-- Header -->
        <header class="sticky top-0 z-30 mb-5 flex items-center justify-between rounded-2xl border border-white/50 bg-white/60 px-4 py-3 shadow-sm backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/50">
            <div class="flex items-center gap-2">
                <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-linear-to-br from-brand-500 to-fuchsia-500 text-lg shadow-md">📁</div>
                <h1 class="bg-linear-to-r from-brand-600 to-fuchsia-500 bg-clip-text text-xl font-bold text-transparent dark:from-brand-300 dark:to-fuchsia-300">SwiftShare</h1>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 rounded-xl bg-slate-100/80 p-1 dark:bg-slate-800/80">
                    <button id="gridViewBtn" class="view-btn active flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition hover:text-brand-600 dark:text-slate-400" title="Grid view">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="12" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="12" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="12" y="12" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
                    </button>
                    <button id="listViewBtn" class="view-btn flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition hover:text-brand-600 dark:text-slate-400" title="List view">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><line x1="3" y1="4" x2="17" y2="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="3" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <button id="themeToggle" class="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-100/80 text-lg transition hover:bg-slate-200 dark:bg-slate-800/80 dark:hover:bg-slate-700" title="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <main class="flex flex-1 flex-col gap-4">
            <!-- Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-3">
                <nav class="breadcrumb flex flex-wrap items-center rounded-xl bg-white/50 px-3 py-2 backdrop-blur dark:bg-slate-900/40" id="breadcrumb">
                    <button class="breadcrumb-item" data-path="">🏠 Home</button>
                </nav>
                <div class="flex items-center gap-2">
                    <button id="newFolderBtn" class="flex items-center gap-1.5 rounded-xl bg-white/70 px-3 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-white dark:bg-slate-800/70 dark:text-slate-200 dark:hover:bg-slate-700">
                        <span class="text-lg leading-none">＋</span> New Folder
                    </button>
                    <label class="flex cursor-pointer items-center gap-1.5 rounded-xl bg-linear-to-r from-brand-600 to-brand-500 px-3 py-2 text-sm font-semibold text-white shadow-md transition hover:opacity-90">
                        <span class="text-base leading-none">⬆</span> Upload
                        <input type="file" id="fileInput" multiple hidden>
                    </label>
                </div>
            </div>

            <!-- Search -->
            <div class="relative">
                <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                <input type="text" id="searchInput" placeholder="Search files and folders..." autocomplete="off"
                    class="w-full rounded-xl border border-white/60 bg-white/70 py-3 pl-11 pr-4 text-sm text-slate-700 shadow-sm outline-none backdrop-blur transition placeholder:text-slate-400 focus:border-brand-400 focus:ring-2 focus:ring-brand-300/50 dark:border-white/10 dark:bg-slate-800/70 dark:text-slate-100">
            </div>

            <!-- Drop zone -->
            <div id="dropZone" class="flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300/70 bg-white/40 py-6 text-center text-slate-500 backdrop-blur transition dark:border-slate-600/60 dark:bg-slate-800/30 dark:text-slate-400">
                <div class="text-3xl">📤</div>
                <p class="text-sm font-medium">Drag &amp; drop files here to upload</p>
            </div>

            <!-- File container -->
            <div id="fileContainer" class="file-container grid-view flex-1">
                <div id="fileList" class="file-list"></div>
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="empty-state hidden flex-col items-center justify-center gap-2 py-20 text-center text-slate-400" style="display: none;">
                <div class="text-5xl">📭</div>
                <p class="text-sm font-medium">This folder is empty</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="mt-6 flex items-center justify-center">
            <div class="connection-info flex items-center gap-2 rounded-full border border-white/50 bg-white/60 px-4 py-2 text-xs text-slate-500 shadow-sm backdrop-blur dark:border-white/10 dark:bg-slate-900/50 dark:text-slate-400">
                <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
                <span>Reachable at</span>
                <span class="connection-url font-semibold text-brand-600 dark:text-brand-300">Loading...</span>
            </div>
        </footer>
    </div>

    <!-- Toasts -->
    <div id="toastContainer" class="fixed right-4 top-4 z-50 flex flex-col gap-2"></div>

    <!-- Live transfer progress -->
    <div id="transferPanel" class="fixed bottom-6 left-1/2 z-50 hidden w-80 -translate-x-1/2">
        <div class="animate-modal-in rounded-2xl border border-white/60 bg-white/90 p-4 shadow-2xl backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/90">
            <div class="mb-2 flex items-center justify-between gap-3">
                <span id="transferName" class="truncate text-sm font-medium text-slate-700 dark:text-slate-100">Transferring…</span>
                <span id="transferPercent" class="shrink-0 text-xs font-semibold text-brand-600 dark:text-brand-300">0%</span>
            </div>
            <div class="h-2 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700">
                <div id="transferBar" class="h-full rounded-full bg-linear-to-r from-brand-500 to-fuchsia-500 transition-all duration-150" style="width:0%"></div>
            </div>
            <div id="transferMeta" class="mt-1 text-right text-[11px] text-slate-400 dark:text-slate-500">0 B / 0 B</div>
        </div>
    </div>

    <!-- Share modal -->
    <div id="shareModal" class="modal fixed inset-0 z-40 hidden items-center justify-center p-4" style="display: none;">
        <div class="modal-backdrop absolute inset-0 bg-slate-900/40 backdrop-blur-sm" data-close="shareModal"></div>
        <div class="modal-content animate-modal-in relative w-full max-w-md rounded-2xl border border-white/60 bg-white/90 p-6 shadow-2xl backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/90">
            <div class="modal-header mb-4 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Share File</h2>
                <button class="modal-close flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-800" data-close="shareModal">✕</button>
            </div>
            <div class="modal-body">
                <form id="shareForm" class="space-y-4">
                    <input type="hidden" id="sharePath">
                    <div class="form-group">
                        <label for="shareExpiry" class="mb-1 block text-sm font-medium text-slate-600 dark:text-slate-300">Expires in (hours)</label>
                        <input type="number" id="shareExpiry" value="24" min="1" max="720"
                            class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-300/50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
                    </div>
                    <div class="form-group">
                        <label for="sharePassword" class="mb-1 block text-sm font-medium text-slate-600 dark:text-slate-300">Password (optional)</label>
                        <input type="password" id="sharePassword" placeholder="Leave empty for no password"
                            class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-300/50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
                    </div>
                    <div class="form-actions flex justify-end gap-2">
                        <button type="button" class="rounded-xl bg-slate-100 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700" data-close="shareModal">Cancel</button>
                        <button type="submit" class="rounded-xl bg-linear-to-r from-brand-600 to-brand-500 px-4 py-2 text-sm font-semibold text-white shadow-md transition hover:opacity-90">Create Share</button>
                    </div>
                </form>
                <div id="shareResult" class="share-result hidden space-y-2" style="display: none;">
                    <div class="form-group">
                        <label class="mb-1 block text-sm font-medium text-slate-600 dark:text-slate-300">Share Link</label>
                        <div class="share-link-container flex gap-2">
                            <input type="text" id="shareLink" readonly
                                class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600 outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
                            <button id="copyShareLink" class="shrink-0 rounded-xl bg-slate-100 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview modal -->
    <div id="previewModal" class="modal fixed inset-0 z-40 hidden items-center justify-center p-4" style="display: none;">
        <div class="modal-backdrop absolute inset-0 bg-slate-900/50 backdrop-blur-sm" data-close="previewModal"></div>
        <div class="modal-content animate-modal-in relative flex w-full max-w-3xl flex-col rounded-2xl border border-white/60 bg-white/95 p-6 shadow-2xl backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/95">
            <div class="modal-header mb-4 flex items-center justify-between">
                <h2 id="previewTitle" class="truncate text-lg font-semibold text-slate-800 dark:text-slate-100">File Preview</h2>
                <button class="modal-close flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-800" data-close="previewModal">✕</button>
            </div>
            <div class="modal-body">
                <div id="previewContent" class="max-h-[70vh] overflow-auto"></div>
            </div>
        </div>
    </div>

    <!-- Context menu -->
    <div id="contextMenu" class="context-menu" style="display: none;"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
